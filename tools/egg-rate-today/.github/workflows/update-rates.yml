name: Update Egg Rates
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_rates.py
      - run: python scripts/generate_site.py
      - run: |
          git config user.name "egg-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ cities/ sitemap.xml robots.txt llms.txt
          git diff --cached --quiet || git commit -m "Update daily egg rates"
          git push
