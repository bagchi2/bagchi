name: Egg Rate Update
on:
  schedule:
    - cron: '25 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install
        run: pip install requests beautifulsoup4
      - name: Backfill 2026 history
        run: python tools/scripts/backfill_2026.py
      - name: Fetch latest official rate
        run: python tools/scripts/update_egg_rates.py
      - name: Build static pages
        run: python tools/scripts/build_site.py
      - name: Commit
        run: |
          git config user.name 'egg-rate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/egg-rate-today sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m 'Update egg rates and 2026 history'
          git push
