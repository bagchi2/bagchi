name: Update E2NECC Egg Rates
on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/egg-rate-today
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/backfill_2026.py
      - run: python scripts/update_egg_rates.py
      - run: python scripts/build_site.py
      - run: |
          cd ../..
          git config user.name "egg-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/egg-rate-today
          git diff --cached --quiet || git commit -m "Update E2NECC egg rates"
          git push
